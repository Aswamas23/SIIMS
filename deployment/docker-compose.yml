version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: siims-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-siims}
      POSTGRES_USER: ${POSTGRES_USER:-siims}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - siims-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-siims}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - siims-net

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: siims-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-siims}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-siims}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_FULL_NAME: ${ADMIN_FULL_NAME}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TLS: ${SMTP_TLS:-true}
    ports:
      - "8000:8000"
    networks:
      - siims-net

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
    container_name: siims-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - siims-net

  nginx:
    image: nginx:alpine
    container_name: siims-nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend
    networks:
      - siims-net

volumes:
  siims-postgres-data:

networks:
  siims-net:
    driver: bridge
